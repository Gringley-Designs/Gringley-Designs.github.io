nav {

ul {
  background: white;
  list-style: none;
  margin: 0;
  padding-left: 0;
}

li {
  color: #f9ab12;
  background: #ffffff;
  display: block;
  float: left; /* This should be changed */
  padding: 1rem;
  position: relative;
  text-decoration: none;
  transition-duration: 0.5s;
}

li a {
  color: #f9ab12;
}

li:hover {
  background: white;
  cursor: pointer;
}

ul li ul {
  background: white;
  visibility: hidden;
  opacity: 0;
  min-width: 5rem;
  position: absolute;
  transition: all 0.5s ease;
  margin-top: 0;
  left: 0;
  display: none;
  z-index: 20;
}

ul li:hover > ul,
ul li:focus-within > ul,
ul li ul:hover {
  visibility: visible;
  opacity: 1;
  display: block;
}

ul li ul li {
  clear: both;
  width: 100%;
}

li:focus-within a {
  outline: none;
}

        nav ul {
    width: 100%; /* Ensures the menu takes the full width */

    justify-content: space-around; /* Distributes items evenly */
     border-bottom: 4px solid #f9ab12; /* Adjust thickness and color as needed */
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
